# ------------------------------------------------------------
# Proje ayarları — tüm script'ler buradan okur
# ------------------------------------------------------------

# Amazon Reviews 2023 (McAuley Lab) kategori adı
# Clothing_Shoes_and_Jewelry  -> tez dokümanındaki kategori (yorum 27.8 GB, meta 18 GB; streaming ile okunur)
# Amazon_Fashion              -> daha küçük alternatif (yorum 1 GB, meta 1.4 GB)
category: Clothing_Shoes_and_Jewelry

# Yorum dosyasının en fazla kaç satırı okunacak.
# null = dosyanın TAMAMI (dosyalar bilgisayardayken önerilen; seçim dosya sırasından bağımsız olur)
max_reviews: null

# Örneklem kriterleri
min_reviews: 10        # ürünün en az yorum sayısı
min_negative: 3        # en az negatif yorum sayısı
negative_max_rating: 2 # rating <= 2 ise negatif
min_words: 5           # bundan kısa negatif yorumlar atılır
max_neg_per_product: 15

# Kapsam filtresi (büyük-küçük harf duyarsız, tam eşleşme):
# ürünün kategori yolunun (meta 'categories') HERHANGİ bir seviyesi include
# listesinde olmalı VE HİÇBİR seviyesi exclude listesinde olmamalı.
# Saat, takı, çanta, bavul, aksesuar, kostüm vb. böylece dışarıda kalır.
# Filtreyi kapatmak için: include_categories: [] ve exclude_categories: []
include_categories: ["Clothing", "Shoes", "Boot Shop", "Sport Specific Clothing"]
exclude_categories: ["Jewelry", "Watches", "Accessories", "Handbags & Wallets",
  "Luggage & Travel Gear", "Shoe, Jewelry & Watch Accessories", "Costumes & Accessories"]

# Aynı ürün altında birebir aynı metne sahip negatif yorumlar tek sayılır
dedupe_reviews: true

# Gold'daki bir ürün etiketleme sırasında "veri uygun değil" çıkarsa
# sırayla yerine konacak yedek ürün sayısı (200'e dahil değil)
n_reserve: 10

# Kaç ürün
n_products: 200
n_gold: 40     # elle etiketlenecek test seti
n_dev: 5       # prompt denemesi için (gold'dan AYRI)

seed: 42

# LLM (Faz 5)
# model: tarihli tam sürüm yazılmalı (ör. gpt-4o-mini-2024-07-18). API erişimi
# doğrulanınca güncellenecek; o zamana kadar gerçek çağrı yapılmaz.
model: gpt-4o-mini
model_verified: false
temperature: 0
# Fiyat (USD / 1 milyon token). Doğrulanmadı: OpenAI fiyat sayfasından teyit edilecek.
price_input_per_1m: 0.15
price_output_per_1m: 0.60
llm_timeout: 120      # saniye, tek çağrı
llm_retries: 3        # hata/zaman aşımında tekrar sayısı (2, 4, 8 sn bekleme)
